services:
  - type: web
    name: rasa-chatbot
    env: python
    pythonVersion: "3.11.9"
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      rasa run --enable-api --cors "*" --port $PORT

    envVars:
      - key: RASA_TOKEN
        value: "your_secure_token_here"
